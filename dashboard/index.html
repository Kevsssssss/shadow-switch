<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowSwitch | Cloud Controller</title>
    <style>
        :root {
            --bg: #111112;
            --surface: #1a1a1c;
            --accent: #dd2c00;
            --text: #ffffff;
            --text-dim: #a0a0a0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            padding: 2rem 0;
            text-align: center;
            border-bottom: 1px solid var(--surface);
            position: relative;
        }

        h1 {
            color: var(--accent);
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header-actions {
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            display: flex;
            gap: 0.5rem;
        }

        .header-btn {
            background: none;
            border: 1px solid var(--surface);
            color: var(--text-dim);
            padding: 0.5rem;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
        }

        .header-btn:hover {
            border-color: var(--accent);
            color: var(--text);
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin-top: 2rem;
        }

        .status-card {
            background: var(--surface);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .status-info {
            flex-grow: 1;
            width: 100%;
        }

        .status-info h2 {
            margin: 0;
            font-size: 1.1rem;
        }

        #machine-selector {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--accent);
            padding: 0.5rem;
            border-radius: 4px;
            font-size: 1rem;
            width: 100%;
            margin-bottom: 0.5rem;
            cursor: pointer;
        }

        .status-info p {
            margin: 0.5rem 0 0;
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        .badge {
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge-online { background: #2e7d32; color: #fff; }
        .badge-offline { background: #c62828; color: #fff; }

        .btn-remove {
            background: none;
            border: 1px solid #444;
            color: #888;
            padding: 0.3rem 0.6rem;
            font-size: 0.7rem;
            margin-top: 1rem;
            cursor: pointer;
            border-radius: 4px;
        }
        .btn-remove:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        button {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--accent);
            padding: 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        button:hover {
            background: var(--accent);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: var(--text-dim);
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: var(--surface);
            padding: 2rem;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .modal h3 { margin-top: 0; color: var(--accent); }
        .modal input {
            width: 100%;
            padding: 0.8rem;
            margin: 0.5rem 0;
            background: var(--bg);
            border: 1px solid var(--surface);
            color: var(--text);
            border-radius: 4px;
            box-sizing: border-box;
        }
        .modal input:focus {
            border-color: var(--accent);
            outline: none;
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .modal-actions button { flex: 1; }
        .btn-cancel { border-color: var(--text-dim); }
        .btn-cancel:hover { background: #333; }

        @media (max-width: 480px) {
            .status-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            .badge {
                align-self: flex-end;
            }
        }

        @media (min-width: 480px) {
            .controls {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>ShadowSwitch</h1>
        <div class="header-actions" id="header-actions" style="display:none;">
            <button class="header-btn" title="Settings" onclick="openSettings()">
                <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            </button>
            <button class="header-btn" title="Logout Dashboard" onclick="logoutDashboard()">
                <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/></svg>
            </button>
        </div>
    </header>

    <!-- Configuration injected securely by Vercel Node script -->
    <script src="config.js"></script>

    <div class="container" id="main-content" style="display:none;">
        <div class="status-card">
            <div class="status-info">
                <select id="machine-selector" onchange="switchMachine()">
                    <option value="">Waiting for machines...</option>
                </select>
                <p id="last-seen">Last seen: --:--</p>
                <p id="local-ip">Local IP: --.--.--.--</p>
                <button class="btn-remove" onclick="deleteMachine()" id="remove-btn" style="display:none;">Remove Machine</button>
            </div>
            <div id="status-badge" class="badge badge-offline">Offline</div>
        </div>

        <div class="controls">
            <button onclick="confirmAction('shutdown')">
                <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/></svg>
                Shutdown
            </button>
            <button onclick="confirmAction('restart')">
                <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                Restart
            </button>
            <button onclick="executeAction('lock')">
                <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg>
                Lock
            </button>
            <button onclick="executeAction('logout')">
                <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/></svg>
                Log Out
            </button>
        </div>
    </div>

    <!-- Login Overlay -->
    <div id="login-overlay" class="overlay" style="display:flex;">
        <div class="modal">
            <h3>ShadowSwitch Login</h3>
            <input type="text" id="login-user" placeholder="Username">
            <input type="password" id="login-pass" placeholder="Password">
            <button onclick="handleLogin()" style="width:100%; margin-top:1rem; background:var(--accent);">Login</button>
        </div>
    </div>

    <!-- Settings Overlay -->
    <div id="settings-overlay" class="overlay">
        <div class="modal">
            <h3>Update Admin Credentials</h3>
            <p style="font-size: 0.8rem; color: var(--text-dim); margin-bottom: 1rem;">Changes apply to all dashboard users.</p>
            <input type="text" id="new-user" placeholder="New Username">
            <input type="password" id="new-pass" placeholder="New Password">
            <input type="password" id="confirm-pass" placeholder="Confirm New Password">
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeSettings()">Cancel</button>
                <button onclick="saveSettings()" style="background:var(--accent);">Save</button>
            </div>
        </div>
    </div>

    <!-- Action Confirmation Modal -->
    <div id="modal-overlay" class="overlay" style="background: rgba(0,0,0,0.85);">
        <div class="modal">
            <h3 id="modal-title">Confirm Action</h3>
            <p id="modal-desc">Are you sure you want to proceed?</p>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button id="modal-confirm" onclick="proceedAction()">Confirm</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
